name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Backend to Production
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 强制获取完整历史，确保所有文件同步
          fetch-depth: 0
      
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # 单仓 workspaces：唯一权威锁文件在仓库根目录
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        # workspaces 依赖统一 hoist 到根 node_modules，必须在仓库根执行 npm ci
        # npm ci 严格按根 package-lock.json 安装，保证可复现；lock 与 package.json 不一致会直接失败
        working-directory: .
        run: |
          npm ci
          npx wrangler --version
      
      - name: Type Check
        run: npm run typecheck

      - name: Apply D1 Migrations
        # 部署前先同步生产库结构；脚本为幂等重放，重复执行安全。
        # 失败即中断，避免旧结构上线新代码。
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/migrate.sh blog-db --remote
      
      - name: Validate Configuration
        run: |
          echo "验证配置文件..."
          npx wrangler --version
          npx wrangler whoami
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./backend
          command: deploy
        env:
          # 确保使用最新的 Wrangler
          WRANGLER_VERSION: 4
      
